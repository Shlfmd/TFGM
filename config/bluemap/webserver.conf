# BlueMap webserver configuration
webserver {
    # Set to false to disable the integrated webserver
    enabled = true
    # The port the webserver listens on
    port = 8100
    # The address to bind to. Use "127.0.0.1" for localhost-only.
    ip = "0.0.0.0"
    # Directory where the webapp files are served from
    webroot = "bluemap/web"
    # Use Server-Sent Events for live map updates
    sse-enabled = true
}
