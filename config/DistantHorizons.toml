_version = 4

# TFGM performance profile. Distant terrain remains useful for navigation while
# expensive detail, transparency, ambient occlusion, and background generation
# are disabled. All changes are visual or affect optional LOD generation only.
[client]
	showDhOptionsButtonInMinecraftUi = true

	[client.advanced.graphics]
		enableSsao = false
		overrideVanillaGraphicsSettings = true

		[client.advanced.graphics.quality]
			lodChunkRenderDistanceRadius = 128
			horizontalQuality = "LOW"
			maxHorizontalResolution = "CHUNK"
			verticalQuality = "LOW"
			transparency = "DISABLED"
			blocksToIgnore = "NON_COLLIDING"
			tintWithAvoidedBlocks = false
			lodShading = "AUTO"
			grassSideRendering = "AS_DIRT"
			ditherDhFade = false
			vanillaFadeMode = "NONE"
			dhFadeFarClipPlane = false
			brightnessMultiplier = "1.0"
			saturationMultiplier = "1.0"
			lodBiomeBlending = 0

		[client.advanced.graphics.genericRendering]
			enableGenericRendering = false
			enableBeaconRendering = false
			enableCloudRendering = false

		[client.advanced.graphics.noiseTexture]
			enableNoiseTexture = false
			noiseSteps = 1
			noiseIntensity = "0.0"
			noiseDropoff = 0

		[client.advanced.graphics.culling]
			overdrawPrevention = "-1.0"
			reduceOverdrawWithFastMovement = true
			enableCaveCulling = true
			caveCullingHeight = 60
			disableFrustumCulling = false
			disableShadowPassFrustumCulling = false

[common.worldGenerator]
	enableDistantGeneration = false
	distantGeneratorMode = "PRE_EXISTING_ONLY"
	showGenerationProgress = "DISABLED"

[common.multiThreading]
	numberOfThreads = 2
	threadRunTimeRatio = "0.5"
	threadPriority = 3

[server]
	sendLevelKeys = true
	enableServerGeneration = false
	generationRequestRateLimit = 5
	maxGenerationRequestDistance = 1024
	enableRealTimeUpdates = false
	realTimeUpdateDistanceRadiusInChunks = 64
	synchronizeOnLoad = false
	syncOnLoadRateLimit = 10
	maxSyncOnLoadRequestDistance = 1024
	playerBandwidthLimit = 250
	globalBandwidthLimit = 2000
	enableAdaptiveTransferSpeed = true
