# Oculus-TFGM defaults. The fork clamps numeric values to safe ranges.
shaderPack=TerraFirmaGreg-Shaders-Complementary-3.1.6.zip
enableShaders=true
enableDebugOptions=false
disableUpdateMessage=true
maxShadowRenderDistance=12
colorSpace=SRGB
tfgm.shadowUpdateInterval=2
tfgm.shadowResolutionScale=0.5
tfgm.entityShadowDistanceScale=0.5
tfgm.renderEntityShadows=false
tfgm.renderBlockEntityShadows=false
tfgm.renderTranslucentShadows=false
tfgm.renderDistantHorizonShadows=false
